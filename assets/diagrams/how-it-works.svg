<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1464 432" width="1464" height="432" role="img" aria-labelledby="wh-title wh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="wh-title">How wallet-helper works: the same expensive call, charged once</title>
  <desc id="wh-desc">A left-to-right plate. In: a call that costs something — a paid API request, a slow model, any heavy function. The work, in three numbered stages: the call is content-addressed, so the key is derived from the function and its arguments rather than from a name somebody has to remember to change; the local store is consulted, and a hit returns the stored result without running anything; and single-flight collapses concurrent identical calls into one, so ten callers asking at the same moment produce one execution and nine waits. Out: the result, computed once and kept across process restarts. The caption records what the plate is really about: the cheapest call is the one that does not happen.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="272" height="78" rx="10"/>
  <text class="n-title" x="164" y="120" text-anchor="middle">an expensive call</text>
  <text class="n-sub" x="164" y="139" text-anchor="middle">paid API, slow model, heavy function</text>
  <path class="flow" d="M306 126 H322" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="326" y="54" width="835" height="144" rx="12"/>
  <text class="panel-label" x="346" y="76">WHAT IT DOES</text>
  <rect class="stage" x="346" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="474" y="127" text-anchor="middle">content-address it</text>
  <text class="n-sub" x="474" y="146" text-anchor="middle">key from the call, not from a name</text>
  <text class="step" x="357" y="110">1</text>
  <path class="flow" d="M606 133 H622" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="628" y="94" width="198" height="78" rx="10"/>
  <text class="n-title" x="727" y="127" text-anchor="middle">consult the store</text>
  <text class="n-sub" x="727" y="146" text-anchor="middle">a hit runs nothing at all</text>
  <text class="step" x="639" y="110">2</text>
  <path class="flow" d="M829 133 H845" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="851" y="94" width="289" height="78" rx="10"/>
  <text class="n-title" x="996" y="127" text-anchor="middle">single-flight</text>
  <text class="n-sub" x="996" y="146" text-anchor="middle">concurrent duplicates collapse into one</text>
  <text class="step" x="862" y="110">3</text>
  <path class="flow" d="M1167 126 H1183" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1187" y="40">OUT</text>
  <rect class="io" x="1187" y="87" width="250" height="78" rx="10"/>
  <text class="n-title" x="1311" y="120" text-anchor="middle">the result, computed once</text>
  <text class="n-sub" x="1311" y="139" text-anchor="middle">kept across restarts</text>
  <rect class="core" x="517" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="732" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="732" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M732 286 V314 H468 V332"/>
  <path class="tie" d="M732 314 H996 V332"/>
  <path class="tie" d="M468 314 V332"/>
  <rect class="surface" x="393" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="468" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M644 314 V332"/>
  <rect class="surface" x="569" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="644" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M820 314 V332"/>
  <rect class="surface" x="745" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="820" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M996 314 V332"/>
  <rect class="surface" x="921" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="996" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="732" y="412" text-anchor="middle">The cheapest call is the one that never happens. Ten callers asking at the same instant produce one execution and nine waits.</text>
</svg>
