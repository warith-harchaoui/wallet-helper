<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 432" width="1544" height="432" role="img" aria-labelledby="wh-title wh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="wh-title">Comment wallet-helper fonctionne : le même appel coûteux, facturé une seule fois</title>
  <desc id="wh-desc">Une plaque de gauche à droite. Entrée : un appel qui coûte quelque chose — une requête d'API payante, un modèle lent, n'importe quelle fonction lourde. Le travail, en trois étapes numérotées : l'appel est adressé par son contenu, donc la clé vient de la fonction puis de ses arguments plutôt que d'un nom que quelqu'un doit penser à changer ; le magasin local est consulté, et une trouvaille rend le résultat stocké sans rien exécuter ; le vol groupé fond les appels identiques simultanés en un seul, donc dix appelants au même instant produisent une exécution puis neuf attentes. Sortie : le résultat, calculé une fois puis conservé d'un redémarrage à l'autre.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="285" height="78" rx="10"/>
  <text class="n-title" x="170" y="120" text-anchor="middle">un appel coûteux</text>
  <text class="n-sub" x="170" y="139" text-anchor="middle">API payante, modèle lent, calcul lourd</text>
  <path class="flow" d="M319 126 H335" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="339" y="54" width="868" height="144" rx="12"/>
  <text class="panel-label" x="359" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="359" y="94" width="276" height="78" rx="10"/>
  <text class="n-title" x="497" y="127" text-anchor="middle">adresser par contenu</text>
  <text class="n-sub" x="497" y="146" text-anchor="middle">la clé vient de l'appel, pas d'un nom</text>
  <text class="step" x="370" y="110">1</text>
  <path class="flow" d="M639 133 H655" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="661" y="94" width="224" height="78" rx="10"/>
  <text class="n-title" x="772" y="127" text-anchor="middle">consulter le magasin</text>
  <text class="n-sub" x="772" y="146" text-anchor="middle">une trouvaille n'exécute rien</text>
  <text class="step" x="672" y="110">2</text>
  <path class="flow" d="M888 133 H904" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="910" y="94" width="276" height="78" rx="10"/>
  <text class="n-title" x="1048" y="127" text-anchor="middle">vol groupé</text>
  <text class="n-sub" x="1048" y="146" text-anchor="middle">les doublons simultanés fondent en un</text>
  <text class="step" x="921" y="110">3</text>
  <path class="flow" d="M1212 126 H1228" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1232" y="40">SORTIE</text>
  <rect class="io" x="1232" y="87" width="284" height="78" rx="10"/>
  <text class="n-title" x="1374" y="120" text-anchor="middle">le résultat, calculé une fois</text>
  <text class="n-sub" x="1374" y="139" text-anchor="middle">conservé entre redémarrages</text>
  <rect class="core" x="562" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="772" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="772" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M772 286 V314 H508 V332"/>
  <path class="tie" d="M772 314 H1036 V332"/>
  <path class="tie" d="M508 314 V332"/>
  <rect class="surface" x="433" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="508" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M684 314 V332"/>
  <rect class="surface" x="609" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="684" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M860 314 V332"/>
  <rect class="surface" x="785" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="860" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M1036 314 V332"/>
  <rect class="surface" x="961" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="1036" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="772" y="412" text-anchor="middle">L'appel le moins cher est celui qui n'a pas lieu. Dix appelants au même instant produisent une exécution puis neuf attentes.</text>
</svg>
