[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-helper"
version = "1.1.1"
description = "Never run the same heavy call twice. Persistent, content-addressed memoization for expensive calls (a paid API request, a slow model, any heavy function), with single-flight so concurrent identical calls collapse into one, across process restarts and, optionally, across processes."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai" },
]
keywords = ["cache", "memoize", "memoization", "single-flight", "deduplication", "content-addressed", "persistent", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# One dependency: os-helper, the shared utility layer of the AI Helpers suite
# (content-addressed hashing, temp folders, path helpers, logging).
dependencies = ["os-helper>=2.0.0,<3"]

[project.optional-dependencies]
# The command-line and HTTP surfaces are opt-in extras; install what you need.
# The argparse CLI needs no extra and is always available as
# `python -m wallet_helper.cli_argparse`.
cli = ["click>=8.1,<9"]
# FastAPI HTTP surface: the centralized dedup server.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# MCP surface (wallet_helper.mcp) — exposes the SAME FastAPI app from [api] as
# MCP tools via fastapi-mcp; needs the api extra's runtime deps too.
mcp = [
    "wallet-helper[api]",
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import. Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release (same issue hit md2star).
    "mcp>=1.12,<2",
]
# httpx powers FastAPI's TestClient, exercised by the api tests.
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "fastapi-mcp>=0.3,<1", "mcp>=1.12,<2"]

[project.scripts]
wallet-helper = "wallet_helper.cli_argparse:main"
wallet-helper-click = "wallet_helper.cli_click:main"
wallet-helper-mcp = "wallet_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/wallet-helper"

[tool.setuptools.packages.find]
include = ["wallet_helper*"]

[tool.pytest.ini_options]
# Run the docstring Examples as tests too, so every ">>>" in the code stays
# true. Optional-surface modules whose deps may be absent are skipped by
# tests/conftest.py's collect_ignore.
addopts = "--doctest-modules"
testpaths = ["tests", "wallet_helper"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D204", "D209", "D403"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
