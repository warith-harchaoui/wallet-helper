# Continuous integration for wallet-helper.
#
# Four jobs:
#   - lint:  ruff check + ruff format --check (PEP 8, import order, and
#            formatting all enforced automatically).
#   - test:  the full pytest suite on one Python (3.12) on Linux (🐧), with the
#            optional surface (fastapi) installed so every surface is exercised.
#            Deliberately a light gate: the multi-version sweep runs locally,
#            before the push.
#   - smoke: the install procedure itself, on all three OSes a user installs on
#            (🐧 Linux, 🍎 macOS, 🪟 Windows). It installs the package + the api
#            extra and then proves it actually works: import, the one
#            `wallet-helper` command, and a real memoize round-trip against the
#            on-disk store. This is what "verified on Windows too" means here,
#            without paying for the whole (spawn-heavy, minutes-slow on Windows)
#            suite on that runner.
#   - floor: `pip install .` + `import wallet_helper` on Python 3.10, so the
#            `requires-python = ">=3.10"` promise has evidence behind it.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: python -m pip install "ruff==0.15.21"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python on Linux; the full multi-version sweep
        # runs locally before push. Cross-OS behaviour (POSIX vs Windows file
        # locking) is still proven cheaply by the `smoke` job below.
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev/optional extras
        # `cli` was dropped in 1.3.0: click is a core dependency now.
        run: python -m pip install -e ".[dev,api]"
      - name: Run tests
        run: python -m pytest -q

  # The install procedure, exercised on every OS the README tells a user to
  # install on. Fast and portable: no spawn Pools, no long-polls, just proof
  # that a fresh install imports, exposes both CLIs, and memoizes for real.
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package + API extra
        # No [cli] extra any more: the CLI is built with click and click is a core
        # dependency, so a plain install carries it. pip only *warns* on an
        # unknown extra, so this line would have stayed wrong in silence.
        run: python -m pip install -e ".[api]"
      - name: Import and report version
        run: python -c "import wallet_helper as wh; print('wallet-helper', wh.__version__)"
      - name: The CLI responds
        # One command line now. This step used to also call
        # `wallet-helper-click`, deleted in 1.3.0 -- and it is what turned this
        # job red (exit 127, command not found) on three runners at once.
        run: |
          wallet-helper --version
          wallet-helper --help
      - name: Memoize round-trip runs the work exactly once
        run: python scripts/smoke_install.py

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import wallet_helper"
