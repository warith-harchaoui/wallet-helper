# Continuous integration for wallet-helper (gist rules 15, 17, 18).
#
# Two jobs mirror the local `make` gate so nothing that passes locally is
# surprised by CI:
#   - lint: ruff check (PEP 8 + import order enforced automatically).
#   - test: pytest across the supported Python matrix, with the optional
#     surfaces (click / fastapi) installed so every surface is exercised.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: Lint
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Core is stdlib-only. Test the full supported range on Linux (🐧), and
        # on the newest Python add macOS (🍎) and Windows (🪟) so the install
        # procedure and the whole test suite are verified on all three OSes a
        # user might install on. macOS and Windows run one version each (newest)
        # to keep the matrix light while still catching POSIX vs Windows path,
        # atomic-replace, and fcntl-less-lock-fallback regressions.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev/optional extras
        run: python -m pip install -e ".[dev,cli,api]"
      - name: Run tests
        run: python -m pytest -q
