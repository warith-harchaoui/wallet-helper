# Continuous integration for wallet-helper.
#
# On every push / PR, two jobs:
#   - gate:  ruff check + ruff format --check, the full pytest suite on one
#            Python (3.12) on Linux with the optional surface (fastapi)
#            installed, then the install smoke (the one `wallet-helper`
#            command and a real memoize round-trip). Deliberately a light
#            gate: the full sweep also runs locally, in .githooks/pre-push.
#   - floor: `pip install .` + `import wallet_helper` on Python 3.10, so the
#            `requires-python = ">=3.10"` promise has evidence behind it.
#
# Weekly and on demand, one more:
#   - smoke-os: the same install smoke on macOS and Windows, the two other
#            OSes the README tells a user to install on (POSIX vs Windows file
#            locking). Off the push path: it proves nothing a commit is likely
#            to break, and it was half of the jobs of every run.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly cross-OS install smoke (macOS, Windows). Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"

# A burst of pushes to the same branch should cost one run, not one per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ruff + pytest + smoke (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev/optional extras
        # ruff pinned: an unpinned install let ruff 0.16 make Markdown
        # code-fence formatting the default, silently breaking format-check on
        # doc examples. Bump it deliberately, not by surprise.
        # `cli` was dropped in 1.3.0: click is a core dependency now.
        run: python -m pip install -e ".[dev,api]" "ruff==0.15.21"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Run tests
        run: python -m pytest -q
      - name: The CLI responds
        run: |
          wallet-helper --version
          wallet-helper --help
      - name: Memoize round-trip runs the work exactly once
        run: python scripts/smoke_install.py

  # The install procedure on the other OSes the README names. Fast and
  # portable: no spawn Pools, no long-polls, just proof that a fresh install
  # imports, exposes the CLI, and memoizes for real.
  smoke-os:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + API extra
        # No [cli] extra any more: click is a core dependency, so a plain
        # install carries it. pip only *warns* on an unknown extra, so a wrong
        # extra here would stay wrong in silence.
        run: python -m pip install -e ".[api]"
      - name: Import and report version
        run: python -c "import wallet_helper as wh; print('wallet-helper', wh.__version__)"
      - name: The CLI responds
        run: |
          wallet-helper --version
          wallet-helper --help
      - name: Memoize round-trip runs the work exactly once
        run: python scripts/smoke_install.py

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import wallet_helper"
